import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
buildscript {
    ext {
        kotlin_version = "2.4.10"
        corutines_version = "1.11.0"
        spring_boot_version = "4.1.0"
        telegrambots_version = "10.2.0"
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:$spring_boot_version")
    }
}
plugins {
    id "org.jetbrains.kotlin.jvm" version "$kotlin_version"
    id "org.jetbrains.kotlin.plugin.spring" version "$kotlin_version"
    id 'org.springframework.boot' version "$spring_boot_version"
    id "nebula.release" version "21.0.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Boot 4.1's BOM pins kotlin.version to 2.3.21; override so the 2.4.10 stdlib we
// compile against doesn't end up paired with an older Kotlin runtime.
ext['kotlin.version'] = kotlin_version

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:$spring_boot_version")

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$corutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j:$corutines_version"
    implementation 'io.github.oshai:kotlin-logging-jvm:8.0.4'
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.springframework.boot:spring-boot-restclient"
    implementation "org.springframework.boot:spring-boot-configuration-processor"
    implementation "org.springframework:spring-context-support"
    implementation "tools.jackson.module:jackson-module-kotlin"
    implementation "org.telegram:telegrambots-springboot-longpolling-starter:$telegrambots_version"
    implementation "org.telegram:telegrambots-client:$telegrambots_version"
    // Only the long-polling/command classes are used; the webhook half drags in Javalin+Jetty.
    implementation("org.telegram:telegrambots-extensions:$telegrambots_version") {
        exclude group: "org.telegram", module: "telegrambots-webhook"
    }
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-io:commons-io:2.22.0'
    implementation "com.bucket4j:bucket4j_jdk17-core:8.19.0"
    implementation 'io.jenetics:jpx:3.2.1'
}

repositories {
    mavenCentral()
}

tasks.register('distrib', Zip) {
    dependsOn bootJar
    def baseName = "${project.name}-${project.version}"

    into("$baseName/") {
        from('build/libs') {
            include "${baseName}.jar"
        }
        from("deploy/common")
    }

    def buildType = "snapshot"
    if (project.version.toString().matches("\\d+\\.\\d+\\.\\d+")) {
        buildType = "production"
    }

    into("$baseName/") {
        from("deploy/$buildType/") {
            include 'docker-compose.yml'
        }
    }
    into("$baseName/credentials") {
        from("deploy/$buildType/") {
            include '*.env'
        }
    }

    archiveFileName = provider { "${baseName}.zip" }
}

build.dependsOn(distrib)

tasks.withType(KotlinCompile).configureEach {
    compilerOptions {
        freeCompilerArgs.add('-Xjsr305=strict')
        jvmTarget = JvmTarget.JVM_25
    }
}
